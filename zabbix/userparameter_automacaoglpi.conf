# UserParameters do Zabbix agent para o automacaoGLPI.
# Ver zabbix/README.md para o passo a passo completo de instalação e os
# itens/triggers sugeridos.
#
# Instalação:
#   1. Copiar este arquivo para /etc/zabbix/zabbix_agentd.d/ (zabbix-agent
#      clássico) ou /etc/zabbix/zabbix_agent2.d/ (zabbix-agent2).
#   2. Garantir que o usuário do zabbix-agent tem permissão de leitura no
#      journal (grupo "systemd-journal") e no diretório logs/ do projeto.
#   3. systemctl restart zabbix-agent   (ou zabbix-agent2)
#   4. Testar a partir do próprio host:
#        zabbix_agentd -t "automacaoglpi.unit.state[automacao-glpi-critico@sla_semanal.service]"
#
# Todas as chaves recebem o NOME COMPLETO da unit systemd como parâmetro,
# ex: automacao-glpi-mensal@atendimento_mensal_diretoria.service — use
# "systemctl list-timers" no servidor para ver os nomes exatos em uso.

# Estado da unit no momento da checagem (active / inactive / failed / ...)
UserParameter=automacaoglpi.unit.state[*],systemctl show '$1' -p ActiveState --value 2>/dev/null || echo "unknown"

# Resultado da última execução (success / failed / timeout / ...)
UserParameter=automacaoglpi.unit.result[*],systemctl show '$1' -p Result --value 2>/dev/null || echo "unknown"

# Timestamp (epoch, segundos) do término da última execução.
# Use com a função nodata()/fuzzytime() do Zabbix para alertar se um
# relatório deveria ter rodado (conforme o .timer) e o timestamp não avançou.
UserParameter=automacaoglpi.unit.last_run[*],systemctl show '$1' -p ExecMainExitTimestamp --value 2>/dev/null | xargs -I{} date -d {} +%s 2>/dev/null || echo 0

# Duração (segundos) da última execução BEM-SUCEDIDA de um relatório,
# lida do log estruturado da automação (não do systemd — o systemd não
# sabe quanto tempo a query/e-mail levaram dentro da execução, só o
# tempo total do processo). O parâmetro aqui é o NOME DO RELATÓRIO
# (chave de config/reports.py), não o nome da unit.
UserParameter=automacaoglpi.report.duracao[*],/opt/automacaoGLPI/venv/bin/python3 /opt/automacaoGLPI/scripts/duracao_ultima_execucao.py '$1' 2>/dev/null || echo -1
